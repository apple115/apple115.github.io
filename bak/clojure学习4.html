true, :connections &#123;13 14, 6 10&#125;&#125;,</span><br><span class="line">:rows 5&#125;</span><br></pre></td></tr></table></figure>

<p>生成游戏图形</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line">      1</span><br><span class="line">     2 3</span><br><span class="line">    4 5 6</span><br><span class="line">  7  8 9 10</span><br><span class="line">11 12 13 14 15</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line">(defn tri*  &quot;Generates lazy sequence of triangular numbers&quot;</span><br><span class="line">([] (tri* 0 1))</span><br><span class="line">([sum n]</span><br><span class="line">(let [new-sum (+ sum n)]</span><br><span class="line">(cons new-sum (lazy-seq (tri* new-sum (inc n)))))))</span><br></pre></td></tr></table></figure>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line">(def tri (tri*))</span><br><span class="line">(take 5 tri)</span><br><span class="line">; =&gt; (1 3 6 10 15)</span><br></pre></td></tr></table></figure>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br></pre></td><td class="code"><pre><span class="line">(defn triangular?</span><br><span class="line">&quot;Is the number triangular? e.g. 1, 3, 6, 10, 15, etc&quot;</span><br><span class="line">[n]</span><br><span class="line">(= n (last (take-while #(&gt;= n %) tri))))</span><br><span class="line"></span><br><span class="line">(triangular? 5)</span><br><span class="line">; =&gt; false</span><br><span class="line"></span><br><span class="line">(triangular? 6); =&gt; true</span><br></pre></td></tr></table></figure>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br></pre></td><td class="code"><pre><span class="line">(defn row-tri</span><br><span class="line">&quot;The triangular number at the end of row n&quot;</span><br><span class="line">[n]</span><br><span class="line">(last (take n tri)))</span><br><span class="line"></span><br><span class="line">(row-tri 1); =&gt; 1</span><br><span class="line">(row-tri 2); =&gt; 3</span><br><span class="line">(row-tri 3); =&gt; 6</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br></pre></td><td class="code"><pre><span class="line">(defn row-num</span><br><span class="line">&quot;Returns row number the position belongs to: pos 1 in row 1,  positions 2 and 3 in row 2, etc&quot;</span><br><span class="line">[pos]</span><br><span class="line">(inc (count (take-while #(&gt; pos %) tri))))</span><br><span class="line"></span><br><span class="line">(row-num 1)</span><br><span class="line">; =&gt; 1</span><br><span class="line">(row-num 5)</span><br><span class="line">; =&gt; 3</span><br></pre></td></tr></table></figure>


<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br></pre></td><td class="code"><pre><span class="line">(defn connect</span><br><span class="line">&quot;Form a mutual connection between two positions&quot;</span><br><span class="line">[board max-pos pos neighbor destination]</span><br><span class="line">(if (&lt;= destination max-pos)</span><br><span class="line">(reduce (fn [new-board [p1 p2]]</span><br><span class="line">(assoc-in new-board [p1 :connections p2] neighbor))</span><br><span class="line">board   [[pos destination] [destination pos]])    board))</span><br><span class="line"></span><br><span class="line">(connect &#123;&#125; 15 1 2 4)</span><br><span class="line">; =&gt; &#123;1 &#123;:connections &#123;4 2&#125;&#125;      4 &#123;:connections &#123;1 2&#125;&#125;&#125;</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br></pre></td><td class="code"><pre><span class="line">(assoc-in &#123;&#125; [:cookie :monster :vocals] &quot;Finntroll&quot;)</span><br><span class="line">; =&gt; &#123;:cookie &#123;:monster &#123;:vocals &quot;Finntroll&quot;&#125;&#125;&#125;</span><br><span class="line"></span><br><span class="line">(get-in &#123;:cookie &#123;:monster &#123;:vocals &quot;Finntroll&quot;&#125;&#125;&#125; [:cookie :monster])</span><br><span class="line">; =&gt; &#123;:vocals &quot;Finntroll&quot;&#125;</span><br><span class="line"></span><br><span class="line">(assoc-in &#123;&#125; [1 :connections 4] 2)</span><br><span class="line">; =&gt; &#123;1 &#123;:connections &#123;4 2&#125;&#125;&#125;</span><br><span class="line"></span><br></pre></td></tr></table></figure>
