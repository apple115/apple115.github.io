<script>
// 实时时钟
function updateTime() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
  
  // 根据时间显示问候语
  const hour = now.getHours();
  let greeting = '你好';
  if (hour >= 5 && hour < 12) greeting = '早上好';
  else if (hour >= 12 && hour < 14) greeting = '中午好';
  else if (hour >= 14 && hour < 18) greeting = '下午好';
  else if (hour >= 18 && hour < 22) greeting = '晚上好';
  else greeting = '夜深了';
  
  document.getElementById('greeting-text').textContent = `${greeting}，apple115`;
}

updateTime();
setInterval(updateTime, 1000);

// 搜索框快捷键
document.querySelector('.search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    this.form.submit();
  }
});

// 页面加载时聚焦搜索框
window.addEventListener('load', function() {
  document.querySelector('.search-input').focus();
});

// 白板功能
const whiteboard = document.getElementById('whiteboard');
const clearBtn = document.getElementById('clear-whiteboard');
const saveIndicator = document.getElementById('save-indicator');

// 加载保存的内容
const savedContent = localStorage.getItem('whiteboard-content');
if (savedContent) {
  whiteboard.value = savedContent;
}

// 自动保存
let saveTimeout;
whiteboard.addEventListener('input', function() {
  clearTimeout(saveTimeout);
  saveIndicator.textContent = '保存中...';
  saveIndicator.style.opacity = '1';
  
  saveTimeout = setTimeout(() => {
    localStorage.setItem('whiteboard-content', whiteboard.value);
    saveIndicator.textContent = '已保存';
    setTimeout(() => {
      saveIndicator.style.opacity = '0';
    }, 1500);
  }, 500);
});

// 清空白板
clearBtn.addEventListener('click', function() {
  if (whiteboard.value.trim() === '' || confirm('确定要清空所有内容吗？')) {
    whiteboard.value = '';
    localStorage.removeItem('whiteboard-content');
    saveIndicator.textContent = '已清空';
    saveIndicator.style.opacity = '1';
    setTimeout(() => {
      saveIndicator.style.opacity = '0';
    }, 1500);
  }
});
</script>
